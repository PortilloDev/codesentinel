# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Anthropic
    anthropic.api_key: '%env(ANTHROPIC_API_KEY)%'
    anthropic.model: '%env(string:ANTHROPIC_MODEL)%'
    anthropic.max_tokens: '%env(int:ANTHROPIC_MAX_TOKENS)%'
    anthropic.max_diff_chars: '%env(int:ANTHROPIC_MAX_DIFF_CHARS)%'

    # GitHub App
    github.app_id: '%env(int:GITHUB_APP_ID)%'
    github.app_name: '%env(string:GITHUB_APP_NAME)%'
    github.private_key_path: '%env(string:GITHUB_APP_PRIVATE_KEY_PATH)%'
    github.webhook_secret: '%env(string:GITHUB_WEBHOOK_SECRET)%'

    # Análisis
    analysis.max_files_per_pr: '%env(int:MAX_FILES_PER_PR)%'
    analysis.analyzed_extensions: '%env(csv:ANALYZED_EXTENSIONS)%'
    analysis.min_severity: '%env(string:MIN_SEVERITY_TO_COMMENT)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
#            string $anthropicApiKey: '%anthropic.api_key%'
#            string $anthropicModel: '%anthropic.model%'
#            int $anthropicMaxTokens: '%anthropic.max_tokens%'
#            int $anthropicMaxDiffChars: '%anthropic.max_diff_chars%'
#            int $githubAppId: '%github.app_id%'
#            string $githubAppName: '%github.app_name%'
#            string $githubPrivateKeyPath: '%github.private_key_path%'
#            string $githubWebhookSecret: '%github.webhook_secret%'
#            int $maxFilesPerPr: '%analysis.max_files_per_pr%'
#            array $analyzedExtensions: '%analysis.analyzed_extensions%'
#            string $minSeverity: '%analysis.min_severity%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
