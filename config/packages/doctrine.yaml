doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # pgvector necesita que registremos el tipo vector
        types:
            vector: Pgvector\Doctrine\VectorType
            order_id: App\Order\Infrastructure\Persistence\Doctrine\Type\OrderIdType

    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Order:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Order/Infrastructure/Persistence/Mapping'
                prefix: 'App\Order\Domain\Model'
                alias: Order

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool
framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system